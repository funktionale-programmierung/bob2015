<div style="display: flex;
            flex-direction: column;
            gap: 2ex;
            align-items: center;">

  <div style="position: relative;
              border-radius: 10px;
              overflow: hidden;
              width: 160px;
              height: 90px;
              box-shadow: 0 4px 16px rgba(0,0,0,0.2);">
    <a href="{{ include.url }}">
      <img style="object-fit: cover; max-height: 100%" src="{{ include.img }}" />
    </a>
    <div style="position: absolute;
                bottom: 4px;
                right: 10px;
                background: rgba(0,0,0,0.4);
                color: white;
                font-size: 0.8em;
                border-radius: 4px;
                padding: 0.5ex 0.5em;">
      {{ include.length }}
    </div>
  </div>

  <div>
    <h5 style="margin:0; font-size: 1em;"><a href="{{ include.url }}">{{ include.title }}</a></h5>

    <div>
      <i style="opacity: 0.8">{{ include.speaker }}</i>
      <br />
      Talk at <a href="{{ include.edition }}">Bob {{ include.edition }}</a>, <a href="{{ include.language }}">{{ include.language }}</a>
    </div>
  </div>
</div>
