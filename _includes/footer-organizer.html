{% if page.head == nil or page.head >= 2025 %}
<div class="organizer-footer">
  <div class="container">
    <a href="http://www.active-group.de" target="_blank" class="organizer-footer-link">
      {% if page.language == "de" or page.language == null %}
        <span class="organizer-footer-prefix">Organisiert mit</span>
        <span class="organizer-footer-heart">❤</span>
        <span class="organizer-footer-prefix">von der</span>
      {% else %}
        <span class="organizer-footer-prefix">Organized with</span>
        <span class="organizer-footer-heart">❤</span>
        <span class="organizer-footer-prefix">by</span>
      {% endif %}
      <img src="/images/active-group-logo.png" alt="Active Group" class="organizer-footer-logo">
    </a>
  </div>
</div>
{% endif %}
